<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architecture Portfolio Background</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; outline: none; z-index: -1; }

        /* コンテンツのセクション */
        section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
            pointer-events: none; /* 背景の3Dを操作したい場合は適宜調整 */
        }
        .content {
            max-width: 500px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-left: 2px solid #fff;
            opacity: 0; /* GSAPでアニメーションさせる */
            transform: translateY(50px);
        }
        h2 { font-size: 3rem; margin: 0; text-transform: uppercase; letter-spacing: 5px; }
    </style>
</head>
<body>

    <canvas id="webgl"></canvas>

    <section id="section1">
        <div class="content">
            <h2>About Me</h2>
            <p>複雑な構造体の中に潜む、私のアイデンティティを紹介します。</p>
        </div>
    </section>

    <section id="section2">
        <div class="content">
            <h2>Works</h2>
            <p>幾何学的な美しさと機能性を両立させたプロジェクト群。</p>
        </div>
    </section>

    <section id="section3">
        <div class="content">
            <h2>Contact</h2>
            <p>新しい構造を共に作り上げましょう。</p>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        /**
         * Base Setup
         */
        const canvas = document.querySelector('#webgl');
        const scene = new THREE.Scene();
        const size = { width: window.innerWidth, height: window.innerHeight };

        // Camera
        const camera = new THREE.PerspectiveCamera(75, size.width / size.height, 0.1, 1000);
        camera.position.set(0, 30, 60); // 初期位置：鳥瞰図
        scene.add(camera);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(size.width, size.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        /**
         * Monument - 建築的なワイヤーフレーム構造体
         * 本来はBlender等で作ったGLBをロードするのが理想ですが、
         * ここではプログラムで「複雑な構造」をシミュレートします。
         */
        const group = new THREE.Group();
        scene.add(group);

        const material = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true,
            transparent: true,
            opacity: 0.2
        });

        // 中心部のドーム (Keyframe 1のターゲット)
        const dome = new THREE.Mesh(new THREE.IcosahedronGeometry(10, 4), material);
        dome.position.set(-15, 0, 0);
        group.add(dome);

        // 曲線の構造体 (Keyframe 2のターゲット)
        const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(12, 3, 200, 16), material);
        torus.position.set(20, 10, -20);
        torus.rotation.x = Math.PI / 2;
        group.add(torus);

        // ヘリカルタワー (Keyframe 3のターゲット)
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(2, 5, 40, 12, 20, true), material);
        tower.position.set(0, 15, -50);
        group.add(tower);

        // 地面のグリッド
        const grid = new THREE.GridHelper(200, 50, 0xffffff, 0x222222);
        grid.position.y = -5;
        scene.add(grid);

        /**
         * Scroll Animation with GSAP
         */
        gsap.registerPlugin(ScrollTrigger);

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1, // スクロールに滑らかに追従
            }
        });

        // スクロールに応じたカメラワークの定義
        tl
        // 1. ドームへズームイン (About Me)
        .to(camera.position, { x: -10, y: 2, z: 20 }, 0)
        .to(camera.rotation, { x: 0, y: -0.5, z: 0 }, 0)
        .to("#section1 .content", { opacity: 1, y: 0 }, 0.1)

        // 2. 次の構造体へ移動 (Works)
        .to(camera.position, { x: 25, y: 15, z: 10 }, 1)
        .to(camera.rotation, { x: -0.5, y: 0.5, z: 0 }, 1)
        .to("#section1 .content", { opacity: 0, y: -50 }, 1)
        .to("#section2 .content", { opacity: 1, y: 0 }, 1.1)

        // 3. タワーを見上げる (Contact)
        .to(camera.position, { x: 0, y: 2, z: -20 }, 2)
        .to(camera.rotation, { x: 0.8, y: 0, z: 0 }, 2)
        .to("#section2 .content", { opacity: 0, y: -50 }, 2)
        .to("#section3 .content", { opacity: 1, y: 0 }, 2.1);

        /**
         * Resize handler
         */
        window.addEventListener('resize', () => {
            size.width = window.innerWidth;
            size.height = window.innerHeight;
            camera.aspect = size.width / size.height;
            camera.updateProjectionMatrix();
            renderer.setSize(size.width, size.height);
        });

        /**
         * Animation Loop
         */
        function animate() {
            requestAnimationFrame(animate);
            // わずかに回転させて動的な印象を与える
            group.children.forEach(mesh => {
                mesh.rotation.y += 0.001;
            });
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
